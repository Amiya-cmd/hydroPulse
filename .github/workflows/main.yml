name: Build Native HydroPulse APK



on:

  push:

    branches: [ "main", "master" ]

  workflow_dispatch:



permissions:

  contents: write



jobs:

  build-apk:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Set up JDK 17

        uses: actions/setup-java@v4

        with:

          java-version: '17'

          distribution: 'temurin'



      - name: Setup Gradle

        uses: gradle/actions/setup-gradle@v3

        with:

          gradle-version: '8.4'



      - name: Build Debug APK (Auto-Signed & Ready to Install)

        run: |

          gradle assembleDebug

          cp app/build/outputs/apk/debug/app-debug.apk HydroPulse.apk



      - name: Upload Compiled HydroPulse APK Artifact

        uses: actions/upload-artifact@v4

        with:

          name: HydroPulse-Native-Android-APK

          path: HydroPulse.apk



      - name: Automatically Publish HydroPulse.apk to GitHub Releases

        uses: softprops/action-gh-release@v2

        with:

          tag_name: latest

          name: HydroPulse for Android (Latest Official APK)

          body: "Download **HydroPulse.apk** below under Assets to install on your Android phone."

          files: HydroPulse.apk

          prerelease: false

