plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hydropulse.tracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.hydropulse.tracker"
        minSdk 24
        targetSdk 34
        versionCode 40
        versionName "4.0"
    }

    signingConfigs {
        releaseKey {
            storeFile file("hydropulse-key.jks")
            storePassword "hydropulse123"
            keyAlias "hydropulse_key"
            keyPassword "hydropulse123"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.releaseKey
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.releaseKey
        }
    }
}
